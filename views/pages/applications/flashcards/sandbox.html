<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <link rel="icon" href="../../../assets/global/alumet.ico" />

        <meta name="description" content="Flashcards: an effective tool to make learning new concepts faster while building long-term memory." />
        <meta name="keywords" content="Alumet, class, free, organization, boards, files, education, messaging, English, real time" />
        <meta property="og:title" content="Alumet Education" />
        <meta property="og:description" content="Flashcards: an effective tool to make learning new concepts faster while building long-term memory." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://education.alumet.io" />
        <meta property="og:image" content="https://i.imgur.com/vL2azjy.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:domain" content="alumet.io" />
        <meta name="twitter:url" content="https://education.alumet.io/" />
        <meta name="twitter:title" content="Alumet Education" />
        <meta name="twitter:description" content="Flashcards: an effective tool to make learning new concepts faster while building long-term memory." />
        <meta name="twitter:image" content="https://i.imgur.com/vL2azjy.png" />

        <title>Flashcards</title>
        <link rel="stylesheet" href="./../../../../style/global.css" />
        <link rel="stylesheet" href="./../../../../style/applications/reviseFlashcards.css" />
    </head>
    <body>
        <section class="loading" style="display: flex">
            <h4>Alumet <span>Education</span></h4>
            <span class="loader-bar"></span>
        </section>
        <div class="finish-section" id="tutorial-fc" style="display: none">
            <div class="finish-box">
                <div class="text">
                    <h1>How does it work?</h1>
                    <div class="tutorial">
                        <div>
                            <img src="../../../assets/global/swipeleft.svg" alt="Swipe left" />
                            <p>Glisse vers la gauche si tu ne connais pas la flashcard</p>
                        </div>
                        <div>
                            <img src="../../../assets/global/tap.svg" alt="Swipe left" />
                            <p>Click the flashcard to show the answer</p>
                        </div>
                        <div>
                            <img src="../../../assets/global/swiperight.svg" alt="Swipe left" />
                            <p>Glisse vers la droite si tu connais la flashcard</p>
                        </div>
                    </div>
                </div>
                <div class="buttons">
                    <button class="large end-of-section" onclick="document.querySelector('.finish-section').style.display = 'none'">Compris !</button>
                </div>
            </div>
        </div>
        <div class="header">
            <h1 id="flashcard-title">Title du jeu de flashcard</h1>
            <button onclick="stopRevision()" class="large greyed">Quitter</button>
        </div>
        <div class="flashcard">
            <div class="progression">
                <div data-bar="3" id="good"></div>
                <div data-bar="2" id="medium"></div>
                <div data-bar="1" id="bad"></div>
                <div data-bar="0" id="neutral"></div>
            </div>
            <div class="flashcards loaded">
                <div class="flashcard--card" style="z-index: 1; transform: scale(0.95) translateY(3.5%); opacity: 0.9; touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0)">
                    <h3 style="filter: blur(15px)">Sample text to be blured</h3>
                </div>
            </div>
        </div>
        <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
        <script src="../../../script/applications/reviseFlashcards.js"></script>
        <script src="../../../script/global.js"></script>
    </body>
</html>
